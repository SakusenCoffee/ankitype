<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki-Powered Japanese Typing Game</title>
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        .selector-container {
            margin-bottom: 25px;
            text-align: center;
        }
        .selector-container label {
            font-weight: bold;
            color: #444;
            margin-right: 8px;
        }
        .selector-container select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .status-message {
            font-size: 0.9rem;
            color: #d9534f;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 10px 0;
        }
        .meaning {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .romaji-container {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            min-height: 40px;
        }
        .typed {
            color: #28a745;
            font-weight: bold;
        }
        .untyped {
            color: #ccc;
        }
        .score {
            margin-top: 30px;
            font-size: 1rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="selector-container">
        <label for="deck-select">Target Deck:</label>
        <select id="deck-select">
            <option value="">Loading Profile Decks...</option>
        </select>
    </div>

    <div class="card">
        <div class="status-message" id="status">Connecting to Anki... Make sure the desktop app is open!</div>
        <div class="kanji" id="display-word">--</div>
        <div class="meaning" id="display-meaning">Awaiting connection sync...</div>
        
        <div class="romaji-container">
            <span class="typed" id="text-typed"></span><span class="untyped" id="text-untyped"></span>
        </div>

        <div class="score">Score: <span id="score-val">0</span></div>
    </div>

    <script>
        // --- 1. CONFIGURATION LAYOUT MAPPINGS ---
        // Change these strings to match the exact field titles inside your target Anki cards
        const FIELD_KANJI = "Front";    // Displays the main bold character text at the top
        const FIELD_ROMAJI = "Back";    // Triggers the typing string pointer (Converted dynamically via WanaKana)
        const FIELD_MEANING = "Back";   // Displays the bottom translation context string definition

        let wordList = [];
        let currentIndex = 0;
        let typedTargetPosition = 0;
        let totalScore = 0;

        // UI DOM Access Pointers
        const statusEl = document.getElementById("status");
        const wordEl = document.getElementById("display-word");
        const meaningEl = document.getElementById("display-meaning");
        const typedEl = document.getElementById("text-typed");
        const untypedEl = document.getElementById("text-untyped");
        const scoreEl = document.getElementById("score-val");
        const deckDropdown = document.getElementById("deck-select");

        // --- 2. ANKICONNECT API BRIDGE CORE ---
        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Connection Failure:", err);
                return null;
            }
        }

        // Fetch user profile metrics and render selector elements
        async function populateDecks() {
            const response = await fetchFromAnki("deckNames");

            if (!response || !response.result) {
                statusEl.textContent = "Error connecting to Anki desktop client. Ensure it's running with AnkiConnect enabled!";
                deckDropdown.innerHTML = '<option value="">Network Connection Error</option>';
                return;
            }

            const decks = response.result;
            deckDropdown.innerHTML = ""; // Clear out placeholder data options

            decks.forEach(deckName => {
                const option = document.createElement("option");
                option.value = deckName;
                option.textContent = deckName;
                deckDropdown.appendChild(option);
            });

            // Set dynamic change monitoring interceptor hooks
            deckDropdown.addEventListener("change", (e) => {
                if (e.target.value) {
                    loadAnkiDeck(e.target.value);
                }
            });

            // Boot load index card arrays tracking the top option value position entry
            if (decks.length > 0) {
                deckDropdown.value = decks[0];
                loadAnkiDeck(decks[0]);
            }
        }

        // --- 3. WORKLOAD TRANSLATION LOADER DATA PIPELINES ---
        async function loadAnkiDeck(targetDeckName) {
            statusEl.style.color = "#d9534f";
            statusEl.textContent = `Scraping content from "${targetDeckName}"...`;
            
            // Step A: Request Note card tracking IDs matching choice
            const findResult = await fetchFromAnki("findNotes", { query: `deck:"${targetDeckName}"` });
            
            if (!findResult || !findResult.result || findResult.result.length === 0) {
                statusEl.textContent = `Empty: Found 0 items matching deck target parameters: "${targetDeckName}"`;
                clearDisplay();
                return;
            }

            // Step B: Collect structural text strings data using tracking numbers
            const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
            
            // Step C: Normalise object structures while running data cleaning loops
            wordList = notesResult.result.map(note => {
                const fields = note.fields;
                
                let originalText = fields[FIELD_ROMAJI]?.value || "";
                let cleanedText = originalText.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
                
                // WanaKana safely maps native character formats ( Hiragana / Katakana / Mixed ) to clean western typing text strings
                let finalRomaji = wanakana.toRomaji(cleanedText).toLowerCase().trim();

                return {
                    kanji: (fields[FIELD_KANJI]?.value || "N/A").replace(/<[^>]*>/g, ''),
                    romaji: finalRomaji,
                    meaning: (fields[FIELD_MEANING]?.value || "N/A").replace(/<[^>]*>/g, '')
                };
            }).filter(word => word.romaji !== "");

            if (wordList.length > 0) {
                statusEl.style.color = "#28a745";
                statusEl.textContent = `Sync Active! Loaded ${wordList.length} items from "${targetDeckName}"`;
                currentIndex = 0;
                shuffleArray(wordList);
                loadWord();
            } else {
                statusEl.textContent = "Error: Cards parsed successfully but layout strings missing appropriate target field types.";
                clearDisplay();
            }
        }

        // --- 4. ENGINE RUNTIME INTERACTION ---
        function loadWord() {
            if (wordList.length === 0) return;
            const currentWord = wordList[currentIndex];
            
            wordEl.textContent = currentWord.kanji;
            meaningEl.textContent = currentWord.meaning;
            
            typedTargetPosition = 0;
            typedEl.textContent = "";
            untypedEl.textContent = currentWord.romaji;
        }

        function clearDisplay() {
            wordEl.textContent = "--";
            meaningEl.textContent = "Please select another deck list container option.";
            typedEl.textContent = "";
            untypedEl.textContent = "";
            wordList = [];
        }

        window.addEventListener("keydown", (e) => {
            if (e.key.length > 1 || wordList.length === 0) return; 

            const currentWord = wordList[currentIndex];
            const expectedChar = currentWord.romaji[typedTargetPosition];

            if (e.key.toLowerCase() === expectedChar) {
                typedTargetPosition++;
                typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
                untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

                if (typedTargetPosition === currentWord.romaji.length) {
                    totalScore++;
                    scoreEl.textContent = totalScore;
                    
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Initialize execution setup loops on boot run
        populateDecks();
    </script>
</body>
</html>
