<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Type // Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700&family=Yuji+Syuku&family=DotGothic16&family=Zen+Maru+Gothic:wght@700&family=Yomogi&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Chokokutai&family=Cherry+Bomb+One&family=Zen+Tokyo+Zoo&family=Noto+Sans+JP:wght@400;700&family=Hina+Mincho&display=swap" rel="stylesheet"></head>
<body>

    <div class="app-layout">
        <div class="selector-container">
            <label for="deck-select">DATABASE DECK</label>
            <select id="deck-select">
                <option value="">Querying local database...</option>
            </select>
        </div>

        <div class="selector-container">
    <label for="font-select">TYPOGRAPHY TYPOLOGY</label>
<select id="font-select">
    <optgroup label="Standard Styles">
        <option value="font-modern">Modern Gothic (Default)</option>
        <option value="font-noto">Noto Sans (Ultra Clean)</option>
        <option value="font-serif">Traditional Mincho (Kaisei)</option>
        <option value="font-hina">Delicate Mincho (Hina)</option>
    </optgroup>
    <optgroup label="Handwriting & Pop">
        <option value="font-brush">Calligraphy Brush (Yuji)</option>
        <option value="font-yomogi">Thin Handwriting (Yomogi)</option>
        <option value="font-hachi">80s Gyaru Pop (Hachi Maru)</option>
        <option value="font-mochiy">Comic Pop Art (Mochiy)</option>
        <option value="font-rounded">Rounded Pop (Zen Maru)</option>
    </optgroup>
    <optgroup label="Experimental & Retro">
        <option value="font-pixel">Retro 8-Bit (DotGothic)</option>
        <option value="font-carved">Wood Carved (Chokokutai)</option>
        <option value="font-bomb">Bubble Graffiti (Cherry Bomb)</option>
        <option value="font-zoo">Abstract Grill (Zen Tokyo Zoo)</option>
    </optgroup>
</select>
</div>

        <div class="card">
            <div class="status-badge" id="status">INIT CONNECTION</div>
            
            <div class="word-showcase">
    <div class="kanji" id="display-word">--</div>
    
    <div class="meaning-wrapper hidden-meaning" id="meaning-box">
        <div class="meaning-prompt">CLICK TO REVEAL DEFINITION</div>
        <div class="meaning" id="display-meaning">Awaiting connection sync...</div>
    </div>
</div>
            
            <!-- UPDATE THIS WORK CONTAINER IN YOUR HTML -->
<div class="romaji-wrapper hidden-romaji" id="romaji-box">
    <div class="romaji-prompt" id="romaji-hint">PRESS [TAB] TO SHOW ROMAJI</div>
    <div class="romaji-text-container">
        <span class="typed" id="text-typed"></span><span class="untyped" id="text-untyped"></span>
    </div>
</div>

            <div class="score-panel">
                <span class="label">TYPED: </span>
                <span class="value" id="score-val">0</span>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION MAPPINGS ---
        const FIELD_KANJI = "Expression";    
        const FIELD_ROMAJI = "ExpressionReading";    
        const FIELD_MEANING = "MainDefinition";   

        let wordList = [];
        let currentIndex = 0;
        let typedTargetPosition = 0;
        let totalScore = 0;

        const statusEl = document.getElementById("status");
        const wordEl = document.getElementById("display-word");
        const meaningEl = document.getElementById("display-meaning");
        const typedEl = document.getElementById("text-typed");
        const untypedEl = document.getElementById("text-untyped");
        const scoreEl = document.getElementById("score-val");
        const deckDropdown = document.getElementById("deck-select");

        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Failure:", err);
                return null;
            }
        }

        async function populateDecks() {
            const response = await fetchFromAnki("deckNames");
            if (!response || !response.result) {
                statusEl.textContent = "OFFLINE - START ANKI";
                statusEl.className = "status-badge status-offline";
                deckDropdown.innerHTML = '<option value="">Network Error</option>';
                return;
            }

            const decks = response.result;
            deckDropdown.innerHTML = ""; 

            decks.forEach(deckName => {
                const option = document.createElement("option");
                option.value = deckName;
                option.textContent = deckName.toUpperCase();
                deckDropdown.appendChild(option);
            });

            deckDropdown.addEventListener("change", (e) => {
                if (e.target.value) loadAnkiDeck(e.target.value);
            });

            if (decks.length > 0) {
                deckDropdown.value = decks[0];
                loadAnkiDeck(decks[0]);
            }
        }

        async function loadAnkiDeck(targetDeckName) {
            statusEl.className = "status-badge status-loading";
            statusEl.textContent = "LOADING QUEUE";
            
            const findResult = await fetchFromAnki("findNotes", { query: `deck:"${targetDeckName}"` });
            if (!findResult || !findResult.result || findResult.result.length === 0) {
                statusEl.textContent = "DECK EMPTY";
                statusEl.className = "status-badge status-offline";
                clearDisplay();
                return;
            }

            const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
            
            wordList = notesResult.result.map(note => {
                const fields = note.fields;
                let originalText = fields[FIELD_ROMAJI]?.value || "";
                let cleanedText = originalText.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
                let finalRomaji = wanakana.toRomaji(cleanedText).toLowerCase().trim();

                return {
                    kanji: (fields[FIELD_KANJI]?.value || "N/A").replace(/<[^>]*>/g, ''),
                    romaji: finalRomaji,
                    meaning: (fields[FIELD_MEANING]?.value || "N/A").replace(/<[^>]*>/g, '')
                };
            }).filter(word => word.romaji !== "");

            if (wordList.length > 0) {
                statusEl.className = "status-badge status-online";
                statusEl.textContent = `${wordList.length} TRACKS SYNCED`;
                currentIndex = 0;
                shuffleArray(wordList);
                loadWord();
            } else {
                statusEl.textContent = "PARSE ERROR";
                statusEl.className = "status-badge status-offline";
                clearDisplay();
            }
        }

        function loadWord() {
            if (wordList.length === 0) return;
            const currentWord = wordList[currentIndex];
            wordEl.textContent = currentWord.kanji;
            meaningEl.textContent = currentWord.meaning;
            typedTargetPosition = 0;
            typedEl.textContent = "";
            untypedEl.textContent = currentWord.romaji;
        }

        function clearDisplay() {
            wordEl.textContent = "--";
            meaningEl.textContent = "Select an alternate database track entry.";
            typedEl.textContent = "";
            untypedEl.textContent = "";
            wordList = [];
        }

        window.addEventListener("keydown", (e) => {
            if (e.key.length > 1 || wordList.length === 0) return; 

            const currentWord = wordList[currentIndex];
            const expectedChar = currentWord.romaji[typedTargetPosition];

            if (e.key.toLowerCase() === expectedChar) {
                typedTargetPosition++;
                typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
                untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

                if (typedTargetPosition === currentWord.romaji.length) {
                    totalScore++;
                    scoreEl.textContent = totalScore;
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // THIRD: Paste this block anywhere inside your <script> tag to power the switch
document.getElementById("font-select").addEventListener("change", (e) => {
    const wordEl = document.getElementById("display-word");
    
    // Reset to base styling class, stripping old font assignments
    wordEl.className = "kanji"; 
    
    // Append the newly selected modifier class string rules
    if (e.target.value) {
        wordEl.classList.add(e.target.value);
    }
});
        // --- ADD THIS TO HANDLING KEYDOWN EVENTS ---
window.addEventListener("keydown", (e) => {
    // 1. Intercept Tab key explicitly to toggle visibility layout states
    if (e.key === "Tab") {
        e.preventDefault(); // Prevents the browser from jumping focus to dropdown menus
        
        const romajiBox = document.getElementById("romaji-box");
        romajiBox.classList.toggle("hidden-romaji");
        return; // Exit out early so 'Tab' isn't checked as a game typing character
    }

    // Existing text game processing rule logic constraints...
    if (e.key.length > 1 || wordList.length === 0) return; 

    const currentWord = wordList[currentIndex];
    const expectedChar = currentWord.romaji[typedTargetPosition];

    if (e.key.toLowerCase() === expectedChar) {
        typedTargetPosition++;
        typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
        untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

        if (typedTargetPosition === currentWord.romaji.length) {
            totalScore++;
            scoreEl.textContent = totalScore;
            
            // 🌟 OPTIONAL QUALITY OF LIFE: Re-hide the hint box automatically on card transition completion
            // document.getElementById("romaji-box").classList.add("hidden-romaji");

            currentIndex = (currentIndex + 1) % wordList.length;
            loadWord();
        }
    }
});
        // Click anywhere on top of the definition container to toggle visibility
document.getElementById("meaning-box").addEventListener("click", () => {
    const meaningBox = document.getElementById("meaning-box");
    meaningBox.classList.toggle("hidden-meaning");
    meaningBox.disable=True;
});

        populateDecks();
    </script>
</body>
</html>
