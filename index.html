<!DOCTYPE html>
<html lang="en" data-theme="dark-slate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Type</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700&family=Yuji+Syuku&family=DotGothic16&family=Zen+Maru+Gothic:wght@700&family=Yomogi&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Chokokutai&family=Cherry+Bomb+One&family=Zen+Tokyo+Zoo&family=Noto+Sans+JP:wght@400;700&family=Hina+Mincho&display=swap" rel="stylesheet">

<body>

    <!-- ROUNDED FLOATING NAVBAR -->

            </div>

            <div class="nav-actions">

                        <line x1="4" y1="10" x2="4" y2="3"></line>

                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>

                    <span>TEST OPTIONS</span>

                <button class="nav-btn" id="anki-tab-btn" title="Anki Deck Settings">

                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span>ANKI</span>
                </button>

                <button class="nav-btn" id="appearance-tab-btn" title="Customization Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    </svg>
                    <span>APPEARANCE</span>
                </button>

                <button class="nav-btn" id="seed-tab-btn" title="Seed Options">
                    <span class="kanji-seed-icon">種</span>
                    <span>SEED</span>
                </button>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: PROFILE -->
        <div class="nav-drawer hidden" id="profile-drawer">
            <div class="drawer-inner" id="profile-container">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: TEST OPTIONS -->
        <div class="nav-drawer" id="test-options-drawer">
            <div class="drawer-inner word-count-nav">
                <!-- Mode Switcher -->
                <div class="count-selector-group">
                    <button class="mode-btn active" id="mode-words-btn">words</button>
                    <button class="mode-btn" id="mode-time-btn">time</button>
                </div>

                <div class="selector-divider"></div>

                <!-- Source Switcher (Hiragana / Katakana / Anki) -->
                <div class="count-selector-group">
                    <button class="source-btn" id="source-hiragana-btn">hiragana</button>
                    <button class="source-btn" id="source-katakana-btn">katakana</button>
                    <button class="source-btn active" id="source-anki-btn">anki</button>
                </div>

                <div class="selector-divider"></div>

                <!-- Word Options -->
                <div class="count-selector-group" id="word-options-group">
                    <button class="count-btn" data-count="10">10w</button>
                    <button class="count-btn" data-count="25">25w</button>
                    <button class="count-btn" data-count="50">50w</button>
                    <button class="count-btn" data-count="custom" id="custom-count-btn">custom</button>
                    <button class="count-btn active" data-count="max">Max</button>
                </div>

                <!-- Time Options -->
                <div class="count-selector-group hidden" id="time-options-group">
                    <button class="time-btn" data-time="15">15s</button>
                    <button class="time-btn active" data-time="30">30s</button>
                    <button class="time-btn" data-time="60">60s</button>
                    <button class="time-btn" data-time="120">120s</button>
                    <button class="time-btn hidden" data-time="infinite" id="infinite-time-btn">infinite</button>
                    <button class="time-btn" data-time="custom" id="custom-time-btn">custom</button>
                </div>

                <!-- Kana Char Count Bar (Shown when Hiragana/Katakana active) -->
                <div class="count-selector-group hidden" id="kana-count-group">
                    <button class="kana-count-btn" data-kana-count="10">10c</button>
                    <button class="kana-count-btn" data-kana-count="25">25c</button>
                    <button class="kana-count-btn" data-kana-count="50">50c</button>
                    <button class="kana-count-btn" data-kana-count="100">100c</button>
                    <button class="kana-count-btn" data-kana-count="custom" id="custom-kana-btn">custom</button>
                </div>

                <div class="custom-input-wrapper hidden" id="custom-input-wrapper">
                    <input type="number" id="custom-count-input" min="1" placeholder="Qty..." />
                    <button id="custom-count-submit">Set</button>
                </div>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: ANKI SETTINGS -->
        <div class="nav-drawer hidden" id="anki-drawer">
            <div class="drawer-inner">
                <div class="drawer-header">
                    <span class="drawer-title">ANKI CONNECTION</span>
                    <div class="status-badge" id="status">INIT CONNECTION</div>
                </div>
                <div class="selector-container">
                    <label for="deck-select">SELECT DECK</label>
                    <select id="deck-select">
                        <option value="">Querying local database...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: CUSTOMIZATION SETTINGS -->
        <div class="nav-drawer hidden" id="appearance-drawer">
            <div class="drawer-inner grid-2">
                <div class="selector-container">
                    <label for="theme-select">COLOR THEME</label>
                    <select id="theme-select">
                        <option value="dark-slate">Dark Slate (Default)</option>
                        <option value="carbon">Carbon (High Contrast)</option>
                        <option value="cyberpunk">Cyberpunk Neon</option>
                        <option value="serika">Serika Dark</option>
                        <option value="dracula">Dracula</option>
                    </select>
                </div>

                <div class="selector-container">
                    <label for="font-select">JAPANESE FONT</label>
                    <select id="font-select">
                        <optgroup label="Standard Styles">
                            <option value="font-modern">Modern Gothic (Default)</option>
                            <option value="font-noto">Noto Sans (Ultra Clean)</option>
                            <option value="font-serif">Traditional Mincho (Kaisei)</option>
                            <option value="font-hina">Delicate Mincho (Hina)</option>
                        </optgroup>
                        <optgroup label="Handwriting & Pop">
                            <option value="font-brush">Calligraphy Brush (Yuji)</option>
                            <option value="font-yomogi">Thin Handwriting (Yomogi)</option>
                            <option value="font-hachi">80s Gyaru Pop (Hachi Maru)</option>
                            <option value="font-mochiy">Comic Pop Art (Mochiy)</option>
                            <option value="font-rounded">Rounded Pop (Zen Maru)</option>
                        </optgroup>
                        <optgroup label="Experimental & Retro">
                            <option value="font-pixel">Retro 8-Bit (DotGothic)</option>
                            <option value="font-carved">Wood Carved (Chokokutai)</option>
                            <option value="font-bomb">Bubble Graffiti (Cherry Bomb)</option>
                            <option value="font-zoo">Abstract Grill (Zen Tokyo Zoo)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="selector-container full-width">
                    <div class="slider-label-row">
                        <label for="main-font-slider">MAIN EXPRESSION FONT SIZE</label>
                        <span class="slider-val-display" id="main-font-val">2.2rem</span>
                    </div>
                    <input type="range" id="main-font-slider" min="1.2" max="4.0" step="0.1" value="2.2" class="font-slider" />
                </div>

                <div class="selector-container full-width">
                    <div class="slider-label-row">
                        <label for="sub-font-slider">ROMAJI / DEFINITION FONT SIZE</label>
                        <span class="slider-val-display" id="sub-font-val">1.0rem</span>
                    </div>
                    <input type="range" id="sub-font-slider" min="0.6" max="2.0" step="0.05" value="1.0" class="font-slider" />
                </div>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: SEED OPTIONS -->
        <div class="nav-drawer hidden" id="seed-drawer">
            <div class="drawer-inner flex-center">
                <div class="seed-controls-group">
                    <button class="nav-btn" id="copy-seed-btn" title="Copy Shareable Seed">
                        <span>Copy Seed! 種</span>
                    </button>
                    <div class="custom-input-wrapper">
                        <input type="text" id="paste-seed-input" placeholder="種のペースト" />
                        <button id="load-seed-btn">ロード</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="app-layout">
        <div class="words-wrapper" id="words-wrapper">
            <div class="words-container" id="words-container"></div>
        </div>

        <div class="typing-controls-hint">
            <span>[TAB] TOGGLE ROMAJI READINGS</span> • <span>[CLICK WORD] SHOW MEANING</span>
        </div>

        <div class="live-input-container" id="live-input-container">
            <div class="live-input-box-wrapper">
                <div class="live-input-box" id="live-input-box">
                    <span class="placeholder-text" id="input-placeholder">Type active word...</span>
                    <span id="live-input-text"></span>
                    <button class="hide-box-btn" id="hide-box-btn" title="Hide Input Box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 14 10 14 10 20"></polyline>
                            <polyline points="20 10 14 10 14 4"></polyline>
                            <line x1="14" y1="10" x2="21" y2="3"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="toggles-row">
                <div class="score-panel-inline">
                    <span class="label" id="score-label">WORDS TYPED</span>
                    <span class="value" id="score-val">0</span>
                </div>

                <div class="score-panel-inline" id="timer-display-panel" style="display: none;">
                    <span class="label">TIME LEFT</span>
                    <span class="value" id="time-left-val">30s</span>
                </div>

                <div class="score-panel-inline">
                    <span class="label">PLAY TIME</span>
                    <span class="value" id="play-time-val">0s</span>
                </div>

                <a href="https://ko-fi.com/mojikazu" target="_blank" rel="noopener noreferrer" class="kofi-btn-icon" title="Support via Ko-fi">
                    <svg class="kofi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                </a>
            </div>
        </div>

        <button class="restore-box-btn hidden" id="restore-box-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            SHOW INPUT BOX
        </button>
    </div>

    <!-- RESULT MODAL SCREEN -->
    <div class="modal-overlay hidden" id="result-modal">
        <div class="modal-card">
            <h2 class="modal-title">TEST COMPLETE</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-value" id="res-cpm">0</span>
                    <span class="stat-label">CPM</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="res-time">0s</span>
                    <span class="stat-label">TIME</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value" id="res-typed">0</span>
                    <span class="stat-label" id="res-typed-label">ITEMS TYPED</span>
                </div>
            </div>
            <div class="typed-words-section">
                <span class="section-title">COMPLETED ITEMS</span>
                <div class="typed-words-list" id="res-completed-list"></div>
            </div>
            <button class="close-modal-btn" id="close-result-modal">RESTART TEST</button>
        </div>
    </div>

    <script>
        const KANJI_FIELDS = ["Expression", "Kanji", "Word", "Japanese", "Vocabulary-Kanji", "Front"];
        const READING_FIELDS = ["ExpressionReading", "Reading", "Furigana", "Kana", "Pronunciation", "Romaji", "Vocabulary-Kana"];
        const MEANING_FIELDS = ["MainDefinition", "Meaning", "Definition", "English", "Glossary", "Vocabulary-English", "Back"];

        const HIRAGANA_CHARS = [
            'あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と',
            'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り',
            'る','れ','ろ','わ','を','ん','が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ','だ','ぢ','づ','で',
            'ど','ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ','きゃ','きゅ','きょ','しゃ','しゅ','しょ',
            'ちゃ','ちゅ','ちょ','にゃ','にゅ','にょ','ひゃ','ひゅ','ひょ','みゃ','みゅ','みょ','りゃ','りゅ',
            'りょ','ぎゃ','ぎゅ','ぎょ','じゃ','じゅ','じょ','びゃ','びゅ','びょ','ぴゃ','ぴゅ','ぴょ','って',
            'っと','っか','っき','っく','つけ','っこ','っさ','っす','っせ','っそ'
        ];

        const KATAKANA_CHARS = [
            'ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ','サ','シ','ス','セ','ソ','タ','チ','ツ','テ','ト',
            'ナ','ニ','ヌ','ネ','ノ','ハ','ヒ','フ','ヘ','ホ','マ','ミ','ム','メ','モ','ヤ','ユ','ヨ','ラ','リ',
            'ル','レ','ロ','ワ','ヲ','ン','ガ','ギ','グ','ゲ','ゴ','ザ','ジ','ズ','ゼ','ゾ','ダ','ヂ','ヅ','デ',
            'ド','バ','ビ','ブ','ベ','ボ','パ','ピ','プ','ペ','ポ','キャ','キュ','キョ','シャ','シュ','ショ',
            'チャ','チュ','チョ','ニャ','ニュ','ニョ','ヒャ','ヒュ','ヒョ','ミャ','ミュ','ミョ','リャ','リュ',
            'リョ','ギャ','ギュ','ギョ','ジャ','ジュ','ジョ','ビャ','ビュ','ビョ','ピャ','ピュ','ピョ','ッテ',
            'ット','ッカ','ッキ','ック','ッケ','ッコ','ッサ','ッス','ッセ','ッソ'
        ];

        let masterDeckList = [];
        let activeWordList = [];
        let currentIndex = 0;
        let typedInput = [];

        let totalScore = 0;
        let showRomaji = false;
        let showMeaning = false;

        // Active Modes & Settings
        let activeMode = localStorage.getItem("anki_type_mode") || "words"; // 'words' | 'time'
        let activeSource = localStorage.getItem("anki_type_source") || "anki"; // 'anki' | 'hiragana' | 'katakana'
        let wordCountSetting = localStorage.getItem("anki_type_word_count") || "max";
        let testTimeSetting = localStorage.getItem("anki_type_time_setting") || "30";
        let kanaCountSetting = localStorage.getItem("anki_type_kana_count") || "25";

        let mainFontSize = localStorage.getItem("anki_type_main_font_size") || "2.2";
        let subFontSize = localStorage.getItem("anki_type_sub_font_size") || "1.0";

        let timeRemaining = 0;
        let testTimerInterval = null;
        let isTestActive = false;
        let testStartTime = 0;
        let totalTypedChars = 0;
        let completedItemsSession = [];

        // Global Play Time Tracker
        let activePlayTimeMs = parseInt(localStorage.getItem("anki_type_play_time") || "0", 10);
        let lastTypingTimestamp = 0;

        let stats = JSON.parse(localStorage.getItem("anki_type_stats") || JSON.stringify({
            kanjiCount: 0,
            hiraganaCount: 0,
            katakanaCount: 0,
            totalChars: 0,
            wordsTyped: 0
        }));

        let isInputBoxHidden = localStorage.getItem("anki_type_hide_box") === "true";
        let currentFontClass = localStorage.getItem("anki_type_font") || "font-modern";
        let currentTheme = localStorage.getItem("anki_type_theme") || "dark-slate";
        let savedSelectedDeck = localStorage.getItem("anki_type_deck") || "";

        function isKanji(ch) { return /[\u4e00-\u9faf\u3400-\u4dbf]/.test(ch); }
        function isHiragana(ch) { return /[\u3040-\u309f]/.test(ch); }
        function isKatakana(ch) { return /[\u30a0-\u30ff]/.test(ch); }

        const statusEl = document.getElementById("status");
        const wordsContainer = document.getElementById("words-container");
        const scoreEl = document.getElementById("score-val");
        const scoreLabel = document.getElementById("score-label");
        const deckDropdown = document.getElementById("deck-select");
        const fontDropdown = document.getElementById("font-select");
        const themeDropdown = document.getElementById("theme-select");
        const liveInputText = document.getElementById("live-input-text");
        const inputPlaceholder = document.getElementById("input-placeholder");
        const liveInputBox = document.getElementById("live-input-box");
        const hideBoxBtn = document.getElementById("hide-box-btn");
        const restoreBoxBtn = document.getElementById("restore-box-btn");

        const profileTabBtn = document.getElementById("profile-tab-btn");
        const testOptionsTabBtn = document.getElementById("test-options-tab-btn");
        const ankiTabBtn = document.getElementById("anki-tab-btn");
        const appearanceTabBtn = document.getElementById("appearance-tab-btn");
        const seedTabBtn = document.getElementById("seed-tab-btn");

        const profileDrawer = document.getElementById("profile-drawer");
        const testOptionsDrawer = document.getElementById("test-options-drawer");
        const ankiDrawer = document.getElementById("anki-drawer");
        const appearanceDrawer = document.getElementById("appearance-drawer");
        const seedDrawer = document.getElementById("seed-drawer");

        const modeWordsBtn = document.getElementById("mode-words-btn");
        const modeTimeBtn = document.getElementById("mode-time-btn");
        const sourceHiraganaBtn = document.getElementById("source-hiragana-btn");
        const sourceKatakanaBtn = document.getElementById("source-katakana-btn");
        const sourceAnkiBtn = document.getElementById("source-anki-btn");

        const wordOptionsGroup = document.getElementById("word-options-group");
        const timeOptionsGroup = document.getElementById("time-options-group");
        const kanaCountGroup = document.getElementById("kana-count-group");

        const countBtns = document.querySelectorAll(".count-btn");
        const timeBtns = document.querySelectorAll(".time-btn");
        const kanaCountBtns = document.querySelectorAll(".kana-count-btn");
        const infiniteTimeBtn = document.getElementById("infinite-time-btn");
        const customInputWrapper = document.getElementById("custom-input-wrapper");
        const customCountInput = document.getElementById("custom-count-input");
        const customCountSubmit = document.getElementById("custom-count-submit");

        const copySeedBtn = document.getElementById("copy-seed-btn");
        const pasteSeedInput = document.getElementById("paste-seed-input");
        const loadSeedBtn = document.getElementById("load-seed-btn");

        const mainFontSlider = document.getElementById("main-font-slider");
        const subFontSlider = document.getElementById("sub-font-slider");
        const mainFontVal = document.getElementById("main-font-val");
        const subFontVal = document.getElementById("sub-font-val");

        const timerDisplayPanel = document.getElementById("timer-display-panel");
        const timeLeftVal = document.getElementById("time-left-val");
        const playTimeVal = document.getElementById("play-time-val");

        const resultModal = document.getElementById("result-modal");
        const resCpm = document.getElementById("res-cpm");
        const resTime = document.getElementById("res-time");
        const resTyped = document.getElementById("res-typed");
        const resTypedLabel = document.getElementById("res-typed-label");
        const resCompletedList = document.getElementById("res-completed-list");
        const closeResultModal = document.getElementById("close-result-modal");

        document.documentElement.setAttribute("data-theme", currentTheme);
        themeDropdown.value = currentTheme;
        fontDropdown.value = currentFontClass;

        function applyFontSizes() {
            document.documentElement.style.setProperty('--kanji-font-size', `${mainFontSize}rem`);
            document.documentElement.style.setProperty('--sub-font-size', `${subFontSize}rem`);
            mainFontSlider.value = mainFontSize;
            subFontSlider.value = subFontSize;
            mainFontVal.textContent = `${mainFontSize}rem`;
            subFontVal.textContent = `${subFontSize}rem`;
        }
        applyFontSizes();

        if (isInputBoxHidden) {
            liveInputBox.classList.add("hidden");
            restoreBoxBtn.classList.remove("hidden");
        }

        function generateSeed() {
            if (!activeWordList || activeWordList.length === 0) return null;
            const seedData = activeWordList.map(w => [w.kanji, w.romaji, w.meaning]);
            const jsonStr = JSON.stringify(seedData);
            return btoa(encodeURIComponent(jsonStr));
        }

        function openTab(tabName) {
            profileDrawer.classList.add("hidden");
            testOptionsDrawer.classList.add("hidden");
            ankiDrawer.classList.add("hidden");
            appearanceDrawer.classList.add("hidden");
            seedDrawer.classList.add("hidden");

            profileTabBtn.classList.remove("active");
            testOptionsTabBtn.classList.remove("active");
            ankiTabBtn.classList.remove("active");
            appearanceTabBtn.classList.remove("active");
            seedTabBtn.classList.remove("active");

            if (tabName === "profile") {
                profileDrawer.classList.remove("hidden");
                profileTabBtn.classList.add("active");
                loadProfileUI();
            } else if (tabName === "test-options") {
                testOptionsDrawer.classList.remove("hidden");
                testOptionsTabBtn.classList.add("active");
            } else if (tabName === "anki") {
                ankiDrawer.classList.remove("hidden");
                ankiTabBtn.classList.add("active");
            } else if (tabName === "appearance") {
                appearanceDrawer.classList.remove("hidden");
                appearanceTabBtn.classList.add("active");
            } else if (tabName === "seed") {
                seedDrawer.classList.remove("hidden");
                seedTabBtn.classList.add("active");
            }
        }

        function loadFromSeed(seedString) {
            try {
                const jsonStr = decodeURIComponent(atob(seedString.trim()));
                const seedData = JSON.parse(jsonStr);

                if (!Array.isArray(seedData) || seedData.length === 0) {
                    alert("Invalid seed format.");
                    return;
                }

                activeWordList = seedData.map(([kanji, romaji, meaning]) => ({
                    kanji,
                    romaji,
                    meaning
                }));

                wordCountSetting = activeWordList.length.toString();
                localStorage.setItem("anki_type_word_count", wordCountSetting);

                setSource("anki");
                setMode("words");

                updateCountNavUI();

                currentIndex = 0;
                typedInput = [];
                totalScore = 0;
                scoreEl.textContent = totalScore;
                totalTypedChars = 0;
                completedItemsSession = [];

                clearInterval(testTimerInterval);
                isTestActive = false;

                renderWordBlock();
                statusEl.className = "status-badge status-online";
                statusEl.textContent = `CUSTOM SEED (${activeWordList.length} WORDS)`;

                openTab("anki");

            } catch (err) {
                console.error("Seed parsing error:", err);
                alert("Failed to load test seed. The code may be corrupted.");
            }
        }

        function updatePlayTimeDisplay() {
            const totalSecs = Math.floor(activePlayTimeMs / 1000);
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            if (hrs > 0) {
                playTimeVal.textContent = `${hrs}h ${mins}m ${secs}s`;
            } else if (mins > 0) {
                playTimeVal.textContent = `${mins}m ${secs}s`;
            } else {
                playTimeVal.textContent = `${secs}s`;
            }
        }
        updatePlayTimeDisplay();

        setInterval(() => {
            const now = Date.now();
            if (now - lastTypingTimestamp <= 2000 && lastTypingTimestamp !== 0) {
                activePlayTimeMs += 100;
                localStorage.setItem("anki_type_play_time", activePlayTimeMs.toString());
                updatePlayTimeDisplay();
            }
        }, 100);

        function onUserActiveTyping() {
            lastTypingTimestamp = Date.now();
            if (!isTestActive) {
                startTestTimer();
            }
        }

        function startTestTimer() {
            isTestActive = true;
            testStartTime = Date.now();

            if (activeMode === "time") {
                if (testTimeSetting === "infinite") {
                    timeLeftVal.textContent = "∞";
                } else {
                    timeRemaining = parseInt(testTimeSetting, 10);
                    timeLeftVal.textContent = `${timeRemaining}s`;

                    clearInterval(testTimerInterval);
                    testTimerInterval = setInterval(() => {
                        timeRemaining--;
                        timeLeftVal.textContent = `${timeRemaining}s`;
                        if (timeRemaining <= 0) {
                            finishTest();
                        }
                    }, 1000);
                }
            }
        }

        function finishTest() {
            clearInterval(testTimerInterval);
            isTestActive = false;
            const elapsedTimeSec = Math.max(1, Math.round((Date.now() - testStartTime) / 1000));
            const cpm = Math.round((totalTypedChars / elapsedTimeSec) * 60);

            resCpm.textContent = cpm;
            resTime.textContent = `${elapsedTimeSec}s`;
            resTyped.textContent = totalScore;
            resTypedLabel.textContent = (activeSource === "anki") ? "WORDS TYPED" : "CHARS TYPED";

            resCompletedList.innerHTML = "";
            completedItemsSession.forEach(item => {
                const tag = document.createElement("span");
                tag.className = "completed-word-tag";
                tag.textContent = item;
                resCompletedList.appendChild(tag);
            });

            resultModal.classList.remove("hidden");
        }

        function logCompletedWord(wordObj) {
            stats.wordsTyped++;
            completedItemsSession.push(wordObj.kanji);
            totalTypedChars += wordObj.romaji.length;

            for (const char of wordObj.kanji) {
                stats.totalChars++;
                if (isKanji(char)) stats.kanjiCount++;
                else if (isHiragana(char)) stats.hiraganaCount++;
                else if (isKatakana(char)) stats.katakanaCount++;
            }
            localStorage.setItem("anki_type_stats", JSON.stringify(stats));
        }

        function setSource(source) {
            activeSource = source;
            localStorage.setItem("anki_type_source", activeSource);

            sourceHiraganaBtn.classList.remove("active");
            sourceKatakanaBtn.classList.remove("active");
            sourceAnkiBtn.classList.remove("active");

            if (source === "hiragana" || source === "katakana") {
                if (source === "hiragana") sourceHiraganaBtn.classList.add("active");
                if (source === "katakana") sourceKatakanaBtn.classList.add("active");

                scoreLabel.textContent = "CHARS TYPED";
                modeWordsBtn.disabled = true;
                infiniteTimeBtn.classList.remove("hidden");

                infiniteTimeBtn.classList.add("hidden");

                    testTimeSetting = "30";

        function updateCountNavUI() {
            let activeCustomVal = "";

            if (activeSource === "hiragana" || activeSource === "katakana") {
                kanaCountBtns.forEach(btn => btn.classList.remove("active"));
                const matchKanaBtn = Array.from(kanaCountBtns).find(b => b.dataset.kanaCount === kanaCountSetting);
                if (matchKanaBtn) {
                    matchKanaBtn.classList.add("active");

                }

        function cleanHtmlText(rawHtml) {
            if (!rawHtml) return "";
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            return doc.body.textContent || "";
        }

        function getFieldValue(fields, targetKeys) {
            for (const key of targetKeys) {
                const match = Object.keys(fields).find(
                    fKey => fKey.toLowerCase() === key.toLowerCase()
                );
                if (match && fields[match]?.value) {
                    return fields[match].value;
                }
            }
            return "";
        }

        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Failure:", err);
                return null;
            }
        }

        async function populateDecks() {
            const response = await fetchFromAnki("deckNames");
            if (!response || !response.result) {
                statusEl.textContent = "OFFLINE - START ANKI";
                statusEl.className = "status-badge status-offline";
                deckDropdown.innerHTML = '<option value="">Network Error</option>';
                return;
            }

            const decks = response.result;
            deckDropdown.innerHTML = "";

            decks.forEach(deckName => {
                const option = document.createElement("option");
                option.value = deckName;
                option.textContent = deckName.toUpperCase();
                deckDropdown.appendChild(option);
            });

            deckDropdown.addEventListener("change", (e) => {
                if (e.target.value) {
                    localStorage.setItem("anki_type_deck", e.target.value);
                    loadAnkiDeck(e.target.value);
                }
            });

            if (decks.length > 0) {
                const targetDeck = (savedSelectedDeck && decks.includes(savedSelectedDeck))
                    ? savedSelectedDeck
                    : decks[0];
                deckDropdown.value = targetDeck;
                loadAnkiDeck(targetDeck);
            }
        }

        async function loadAnkiDeck(targetDeckName) {
            statusEl.className = "status-badge status-loading";
            statusEl.textContent = "LOADING QUEUE";

            const findResult = await fetchFromAnki("findNotes", { query: `deck:"${targetDeckName}"` });
            if (!findResult || !findResult.result || findResult.result.length === 0) {
                statusEl.textContent = "DECK EMPTY";
                statusEl.className = "status-badge status-offline";
                wordsContainer.innerHTML = `<div class="empty-state">No cards found in deck "${targetDeckName}".</div>`;
                return;
            }

            const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });

            masterDeckList = notesResult.result.map(note => {
                const fields = note.fields;
                let rawKanji = getFieldValue(fields, KANJI_FIELDS);
                let rawRomaji = getFieldValue(fields, READING_FIELDS);
                let rawMeaning = getFieldValue(fields, MEANING_FIELDS);

                let cleanedRomajiText = cleanHtmlText(rawRomaji).trim();
                let finalRomaji = wanakana.toRomaji(cleanedRomajiText).toLowerCase().trim();

                return {
                    kanji: cleanHtmlText(rawKanji || "N/A"),
                    romaji: finalRomaji,
                    meaning: cleanHtmlText(rawMeaning || "N/A")
                };
            }).filter(word => word.romaji !== "");

            if (masterDeckList.length > 0) {
                statusEl.className = "status-badge status-online";
                statusEl.textContent = `${masterDeckList.length} TRACKS SYNCED`;

                const urlParams = new URLSearchParams(window.location.search);
                const seedParam = urlParams.get("seed");
                if (seedParam) {
                    loadFromSeed(seedParam);
                } else if (activeSource === "anki") {
                    applyWordCountFilter();
                }
            } else {
                statusEl.textContent = "PARSE ERROR";
                statusEl.className = "status-badge status-offline";
                wordsContainer.innerHTML = '<div class="empty-state">Unable to parse cards from selected deck.</div>';
            }
        }

        function generateKanaList(charSet, count = 100) {
            const list = [];
            for (let i = 0; i < count; i++) {
                const char = charSet[Math.floor(Math.random() * charSet.length)];
                list.push({
                    kanji: char,
                    romaji: wanakana.toRomaji(char).toLowerCase(),
                    meaning: "Kana Character"
                });
            }
            return list;
        }

        function applyWordCountFilter() {
            if (activeSource === "hiragana" || activeSource === "katakana") {
                const qty = parseInt(kanaCountSetting, 10) || 25;
                const charSet = (activeSource === "hiragana") ? HIRAGANA_CHARS : KATAKANA_CHARS;
                activeWordList = generateKanaList(charSet, qty);
            } else {
                if (masterDeckList.length === 0) return;
                let listCopy = [...masterDeckList];
                shuffleArray(listCopy);

                if (activeMode === "time") {
                    activeWordList = listCopy;
                } else {
                    if (wordCountSetting === "max") {
                        activeWordList = listCopy;
                    } else {
                        let qty = parseInt(wordCountSetting, 10);
                        activeWordList = isNaN(qty) ? listCopy : listCopy.slice(0, qty);
                    }
                }
            }

            currentIndex = 0;
            typedInput = [];
            totalScore = 0;
            scoreEl.textContent = totalScore;
            totalTypedChars = 0;
            completedItemsSession = [];

            clearInterval(testTimerInterval);
            isTestActive = false;
            timeRemaining = (testTimeSetting === "infinite") ? "∞" : testTimeSetting;
            timeLeftVal.textContent = (testTimeSetting === "infinite") ? "∞" : `${timeRemaining}s`;

            renderWordBlock();
        }

        function renderWordBlock() {
            wordsContainer.innerHTML = "";
            wordsContainer.style.transform = `translateY(0px)`;

            activeWordList.forEach((wordObj, idx) => {
                const wordNode = document.createElement("div");
                wordNode.className = "word-item";
                if (idx === currentIndex) wordNode.classList.add("active");

                const kanjiWrapperNode = document.createElement("div");
                kanjiWrapperNode.className = "kanji-wrapper";

                const kanjiNode = document.createElement("div");
                kanjiNode.className = `kanji-text ${currentFontClass}`;
                kanjiNode.textContent = wordObj.kanji;
                kanjiWrapperNode.appendChild(kanjiNode);

                const romajiNode = document.createElement("div");
                romajiNode.className = `romaji-text ${!showRomaji ? 'hidden' : ''}`;

                for (let i = 0; i < wordObj.romaji.length; i++) {
                    const charSpan = document.createElement("span");
                    charSpan.className = "char";
                    charSpan.textContent = wordObj.romaji[i];
                    romajiNode.appendChild(charSpan);
                }

                const meaningNode = document.createElement("div");
                meaningNode.className = `meaning-text ${!showMeaning ? 'hidden' : ''}`;
                meaningNode.textContent = wordObj.meaning;

                wordNode.appendChild(kanjiWrapperNode);
                wordNode.appendChild(romajiNode);
                wordNode.appendChild(meaningNode);

                wordNode.addEventListener("click", () => {
                    showMeaning = !showMeaning;
                    updateVisibility();
                });

                wordsContainer.appendChild(wordNode);
            });

            updateDisplay();
        }

        function updateDisplay() {
            const currentWordObj = activeWordList[currentIndex];
            const currentWordNode = wordsContainer.children[currentIndex];
            if (!currentWordNode || !currentWordObj) return;

            const romajiNode = currentWordNode.querySelector(".romaji-text");
            const charSpans = romajiNode.querySelectorAll(".char");

            charSpans.forEach((span, idx) => {
                span.classList.remove("current", "neutral-typed");

                if (idx < typedInput.length) {
                    span.classList.add("neutral-typed");
                } else if (idx === typedInput.length) {
                    span.classList.add("current");
                }
            });

            liveInputText.innerHTML = "";
            if (typedInput.length > 0) {
                inputPlaceholder.style.display = "none";
                typedInput.forEach(char => {
                    const charSpan = document.createElement("span");
                    charSpan.textContent = char;
                    charSpan.className = "typed-char-neutral";
                    liveInputText.appendChild(charSpan);
                });
            } else {
                inputPlaceholder.style.display = "inline";
            }

            const firstWordTop = wordsContainer.children[0].offsetTop;
            const currentWordTop = currentWordNode.offsetTop;
            const currentLineOffset = currentWordTop - firstWordTop;

            if (currentLineOffset > 0) {
                wordsContainer.style.transform = `translateY(-${currentLineOffset}px)`;
            } else {
                wordsContainer.style.transform = `translateY(0px)`;
            }
        }

        function updateVisibility() {
            const allRomaji = document.querySelectorAll(".romaji-text");
            const allMeaning = document.querySelectorAll(".meaning-text");

            allRomaji.forEach(el => showRomaji ? el.classList.remove("hidden") : el.classList.add("hidden"));
            allMeaning.forEach(el => showMeaning ? el.classList.remove("hidden") : el.classList.add("hidden"));

            updateDisplay();
        }

        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

            if (e.ctrlKey && e.key === "Enter") {
                e.preventDefault();
                if (isTestActive && activeMode === "time" && testTimeSetting === "infinite") {
                    finishTest();
                }
                return;
            }

            if (e.key === "Tab") {
                e.preventDefault();
                showRomaji = !showRomaji;
                updateVisibility();
                return;
            }

            if (activeWordList.length === 0) return;
            const currentWord = activeWordList[currentIndex];

            if (e.key === "Backspace") {
                if (typedInput.length > 0) {
                    typedInput.pop();
                    updateDisplay();
                }
                return;
            }

            if (e.key.length > 1 || e.ctrlKey || e.metaKey || e.altKey) return;

            onUserActiveTyping();

            const keyTyped = e.key.toLowerCase();
            const expectedChar = currentWord.romaji[typedInput.length];

            if (keyTyped === expectedChar) {
                typedInput.push(keyTyped);

                if (typedInput.length === currentWord.romaji.length) {
                    const finishedWordNode = wordsContainer.children[currentIndex];
                    finishedWordNode.classList.remove("active");
                    finishedWordNode.classList.add("completed");

                    totalScore++;
                    scoreEl.textContent = totalScore;

                    logCompletedWord(currentWord);

                    currentIndex++;
                    typedInput = [];

                    if (currentIndex < activeWordList.length) {
                        wordsContainer.children[currentIndex].classList.add("active");
                    } else {
                        if (activeMode === "words") {
                            finishTest();
                        } else {
                            applyWordCountFilter();
                        }
                    }
                }
            } else {
                const activeCard = wordsContainer.children[currentIndex];
                activeCard.classList.add("error-wipe");
                setTimeout(() => activeCard.classList.remove("error-wipe"), 250);
                typedInput = [];
            }

            updateDisplay();
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function loadProfileUI() {
            const container = document.getElementById('profile-container');
            if (!container) return;

            if (!currentUserToken) {
                container.innerHTML = `
                    <div class="auth-form-container">
                        <span class="drawer-title" style="text-align:center;">USER ACCOUNT</span>
                        <div class="auth-field">
                            <label for="reg-username">USERNAME</label>
                            <input type="text" id="reg-username" placeholder="Enter username..." />

                        <div class="auth-field">
                            <label for="reg-password">PASSWORD</label>
                            <input type="password" id="reg-password" placeholder="Enter password..." />
                        </div>
                        <div class="auth-field">
                            <label for="reg-confirm">CONFIRM PASSWORD <span class="field-opt">(register only)</span></label>
                            <input type="password" id="reg-confirm" placeholder="Re-type password to register..." />
                        </div>
                        <div class="auth-error" id="auth-err-msg"></div>
                        <button class="auth-btn" id="auth-submit-btn">LOGIN / REGISTER</button>
                    </div>
                `;

                document.getElementById('auth-submit-btn').onclick = async () => {
                    const user = document.getElementById('reg-username').value;
                    const pass = document.getElementById('reg-password').value;
                    const confirm = document.getElementById('reg-confirm').value;
                    const errEl = document.getElementById('auth-err-msg');

                    if (confirm && pass !== confirm) {
                        errEl.textContent = "Passwords do not match!";
                        return;
                    }

                    const endpoint = confirm ? '/api/register' : '/api/login';
                    try {
                        const res = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: user, password: pass })
                        });
                        const data = await res.json();

                        if (data.error) {
                            errEl.textContent = data.error;
                        } else {
                            localStorage.setItem('anki_jwt', data.token);
                            currentUserToken = data.token;
                            loadProfileUI();
                        }
                    } catch (err) {
                        errEl.textContent = "Server error. Please try again.";
                    }
                };
            } else {
                try {
                    const res = await fetch('/api/profile', {
                        headers: { 'Authorization': `Bearer ${currentUserToken}` }
                    });

                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('anki_jwt');
                        currentUserToken = null;
                        loadProfileUI();
                        return;
                    }

                    const data = await res.json();

                    container.innerHTML = `
                        <div class="profile-card">
                            <div class="avatar-wrapper" onclick="document.getElementById('avatar-input').click()">
                                <img src="${data.avatar}" id="profile-avatar-img" alt="Avatar"/>
                                <div class="avatar-overlay">EDIT</div>
                            </div>
                            <input type="file" id="avatar-input" class="hidden" accept="image/*" />
                            <h3 class="profile-username">${data.username}</h3>
                            <div class="profile-stats-grid">
                                <div class="stat-box"><span class="stat-value">${Math.floor((data.playtime || 0) / 60)}m</span><span class="stat-label">PLAYTIME</span></div>
                                <div class="stat-box"><span class="stat-value">${data.highest_cpm || 0}</span><span class="stat-label">HIGHEST CPM</span></div>
                                <div class="stat-box"><span class="stat-value">${data.avg_cpm || 0}</span><span class="stat-label">AVG CPM</span></div>
                                <div class="stat-box"><span class="stat-value">${data.stats?.kanji_count || 0}</span><span class="stat-label">KANJI</span></div>
                                <div class="stat-box"><span class="stat-value">${data.stats?.hiragana_count || 0}</span><span class="stat-label">HIRAGANA</span></div>
                                <div class="stat-box"><span class="stat-value">${data.stats?.katakana_count || 0}</span><span class="stat-label">KATAKANA</span></div>
                            </div>
                            <button id="logout-btn" class="auth-btn logout-btn">LOGOUT</button>
                        </div>
                    `;

                    document.getElementById('avatar-input').onchange = async (e) => {
                        if (!e.target.files[0]) return;
                        const formData = new FormData();
                        formData.append('avatar', e.target.files[0]);

                        const uploadRes = await fetch('/api/profile/avatar', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${currentUserToken}` },
                            body: formData
                        });
                        const uploadData = await uploadRes.json();
                        if (uploadData.avatar) {
                            document.getElementById('profile-avatar-img').src = uploadData.avatar;
                        }
                    };

                    document.getElementById('logout-btn').onclick = () => {
                        localStorage.removeItem('anki_jwt');
                        currentUserToken = null;
                        loadProfileUI();
                    };

                } catch (err) {
                    console.error('Failed to fetch profile:', err);
                }
            }
        }

        setSource(activeSource);
        populateDecks();
    </script>
</body>
</html>
