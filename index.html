
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki-Powered Japanese Typing</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .status-message {
            font-size: 0.9rem;
            color: #d9534f;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 10px 0;
        }
        .meaning {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .romaji-container {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            min-height: 40px;
        }
        .typed {
            color: #28a745;
            font-weight: bold;
        }
        .untyped {
            color: #ccc;
        }
        .score {
            margin-top: 30px;
            font-size: 1rem;
            color: #888;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
</head>
<body>
    
    <div style="margin-bottom: 20px; text-align: center;">
    <label for="deck-select" style="font-weight: bold; color: #444;">Select Deck: </label>
    <select id="deck-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem;">
        <option value="">Loading your decks...</option>
    </select>
</div>
    
    <div class="card">
        <div class="status-message" id="status">Connecting to Anki... Make sure Anki is open!</div>
        <div class="kanji" id="display-word">--</div>
        <div class="meaning" id="display-meaning">Loading deck data...</div>
        
        <div class="romaji-container">
            <span class="typed" id="text-typed"></span><span class="untyped" id="text-untyped"></span>
        </div>

        <div class="score">Score: <span id="score-val">0</span></div>
    </div>

    <script>

        async function populateNoteTypes() {
    const dropdown = document.getElementById("note-type-select");

    // 1. Fetch all model (Note Type) names from Anki
    const response = await fetchFromAnki("modelNames");

    if (!response || !response.result) {
        dropdown.innerHTML = '<option value="">Error loading types</option>';
        return;
    }

    const noteTypes = response.result;

    // 2. Clear out the placeholder loading option
    dropdown.innerHTML = "";

    // 3. Loop through names and build out the drop down options
    noteTypes.forEach(typeName => {
        const option = document.createElement("option");
        option.value = typeName;
        option.textContent = typeName;
        dropdown.appendChild(option);
    });

    // 4. Handle user interactions when changing options
    dropdown.addEventListener("change", (e) => {
        const selectedType = e.target.value;
        console.log("User selected note type:", selectedType);
        
        // Optional: You can trigger your deck loader here if needed
        // e.g., loadAnkiDeckByModel(selectedType);
    });
}

        // --- NEW: Fetch and populate all deck names ---
async function populateDecks() {
    const dropdown = document.getElementById("deck-select");
    const response = await fetchFromAnki("deckNames");

    if (!response || !response.result) {
        dropdown.innerHTML = '<option value="">Error connecting to Anki</option>';
        return;
    }

    const decks = response.result;
    dropdown.innerHTML = ""; // Clear placeholder

    decks.forEach(deckName => {
        const option = document.createElement("option");
        option.value = deckName;
        option.textContent = deckName;
        dropdown.appendChild(option);
    });

    // Automatically trigger the deck load whenever the user changes the dropdown selection
    dropdown.addEventListener("change", (e) => {
        if (e.target.value) {
            loadAnkiDeck(e.target.value);
        }
    });

    // Load the first deck in the list by default on startup
    if (decks.length > 0) {
        dropdown.value = decks[0];
        loadAnkiDeck(decks[0]);
    }
}

// --- UPDATED: Pass target deck name dynamically into the loader ---

    // Step B: Grab note data strings using IDs
    const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
    
    // Step C: Map note data (Running WanaKana transformation)
    wordList = notesResult.result.map(note => {
        const fields = note.fields;
        let originalText = fields[FIELD_ROMAJI]?.value || "";
        let cleanedText = originalText.replace(/<[^>]*>/g, '').trim();
        let finalRomaji = wanakana.toRomaji(cleanedText).toLowerCase().trim();

        return {
            kanji: (fields[FIELD_KANJI]?.value || "N/A").replace(/<[^>]*>/g, ''),
            romaji: finalRomaji,
            meaning: (fields[FIELD_MEANING]?.value || "N/A").replace(/<[^>]*>/g, '')
        };
    }).filter(word => word.romaji !== "");

    if (wordList.length > 0) {
        statusEl.style.color = "#28a745";
        statusEl.textContent = `Connected! Loaded ${wordList.length} cards from "${targetDeckName}"`;
        currentIndex = 0;
        shuffleArray(wordList);
        loadWord();
    } else {
        statusEl.textContent = "Error: Found notes, but none have valid text mappings.";
    }
}

// --- UPDATE THE INITIALIZATION LINE ---
// Instead of running loadAnkiDeck() directly at the bottom of your file, fire up the deck picker

// Call this function when the web application boots up!
//populateNoteTypes();
        const selectedType = document.getElementById("note-type-select").value;
        // --- 1. CONFIGURATION ---
        // Change these strings to match the exact column/field names in your Anki Deck Note Type!
        const DECK_NAME = "Mining"; 
        const FIELD_KANJI = "Expression";    // Or "Expression" / "Kanji"
        const FIELD_ROMAJI = "ExpressionReading";  // The field holding your target typing syllables
        const FIELD_MEANING = "Expression";   // Or "Meaning" / "Glossary"

        let wordList = [];
        let currentIndex = 0;
        let typedTargetPosition = 0;
        let totalScore = 0;

        // UI DOM Elements
        const statusEl = document.getElementById("status");
        const wordEl = document.getElementById("display-word");
        const meaningEl = document.getElementById("display-meaning");
        const typedEl = document.getElementById("text-typed");
        const untypedEl = document.getElementById("text-untyped");
        const scoreEl = document.getElementById("score-val");

        // --- 2. ANKICONNECT API ENGINE ---
        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Communication Error:", err);
                return null;
            }
        }

        async function loadAnkiDeck(targetDeckName) {
    statusEl.style.color = "#d9534f";
    statusEl.textContent = `Loading cards from "${targetDeckName}"...`;
    
    // Step A: Grab Note IDs matching the dropdown choice
    const findResult = await fetchFromAnki("findNotes", { query: `deck:"${targetDeckName}"` });
    
    if (!findResult || !findResult.result || findResult.result.length === 0) {
        statusEl.textContent = `Error: No cards found in deck "${targetDeckName}".`;
        wordEl.textContent = "--";
        meaningEl.textContent = "";
        typedEl.textContent = "";
        untypedEl.textContent = "";
        wordList = [];
        return;
    }

    // Step B: Grab note data strings using IDs
    const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
    
    // Step C: Map note data (Running WanaKana transformation)
    wordList = notesResult.result.map(note => {
        const fields = note.fields;
        let originalText = fields[FIELD_ROMAJI]?.value || "";
        let cleanedText = originalText.replace(/<[^>]*>/g, '').trim();
        let finalRomaji = wanakana.toRomaji(cleanedText).toLowerCase().trim();

        return {
            kanji: (fields[FIELD_KANJI]?.value || "N/A").replace(/<[^>]*>/g, ''),
            romaji: finalRomaji,
            meaning: (fields[FIELD_MEANING]?.value || "N/A").replace(/<[^>]*>/g, '')
        };
    }).filter(word => word.romaji !== "");

    if (wordList.length > 0) {
        statusEl.style.color = "#28a745";
        statusEl.textContent = `Connected! Loaded ${wordList.length} cards from "${targetDeckName}"`;
        currentIndex = 0;
        shuffleArray(wordList);
        loadWord();
    } else {
        statusEl.textContent = "Error: Found notes, but none have valid text mappings.";
    }
}

        // --- 3. GAME RUNTIME INTERACTION ENGINE ---
        function loadWord() {
            if (wordList.length === 0) return;
            const currentWord = wordList[currentIndex];
            
            wordEl.textContent = currentWord.kanji;
            meaningEl.textContent = currentWord.meaning;
            
            typedTargetPosition = 0;
            typedEl.textContent = "";
            untypedEl.textContent = currentWord.romaji;
        }

        window.addEventListener("keydown", (e) => {
            if (e.key.length > 1 || wordList.length === 0) return; 

            const currentWord = wordList[currentIndex];
            const expectedChar = currentWord.romaji[typedTargetPosition];

            console.log("You pressed:", e.key.toLowerCase());
    console.log("Expected char:", expectedChar);

            if (e.key.toLowerCase() === expectedChar) {
                typedTargetPosition++;
                typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
                untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

                if (typedTargetPosition === currentWord.romaji.length) {
                    totalScore++;
                    scoreEl.textContent = totalScore;
                    
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }
            }
        });

        // Helper helper function to mix card array index values cleanly
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Boot Init run
//        loadAnkiDeck();
        populateDecks();
    </script>
</body>
</html>
