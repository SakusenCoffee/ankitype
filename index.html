<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki-Powered Japanese Typing</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .status-message {
            font-size: 0.9rem;
            color: #d9534f;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 10px 0;
        }
        .meaning {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .romaji-container {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            min-height: 40px;
        }
        .typed {
            color: #28a745;
            font-weight: bold;
        }
        .untyped {
            color: #ccc;
        }
        .score {
            margin-top: 30px;
            font-size: 1rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-message" id="status">Connecting to Anki... Make sure Anki is open!</div>
        <div class="kanji" id="display-word">--</div>
        <div class="meaning" id="display-meaning">Loading deck data...</div>
        
        <div class="romaji-container">
            <span class="typed" id="text-typed"></span><span class="untyped" id="text-untyped"></span>
        </div>

        <div class="score">Score: <span id="score-val">0</span></div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        // Change these strings to match the exact column/field names in your Anki Deck Note Type!
        const DECK_NAME = "Japanese Vocabulary"; 
        const FIELD_KANJI = "Front";    // Or "Expression" / "Kanji"
        const FIELD_ROMAJI = "Romaji";  // The field holding your target typing syllables
        const FIELD_MEANING = "Back";   // Or "Meaning" / "Glossary"

        let wordList = [];
        let currentIndex = 0;
        let typedTargetPosition = 0;
        let totalScore = 0;

        // UI DOM Elements
        const statusEl = document.getElementById("status");
        const wordEl = document.getElementById("display-word");
        const meaningEl = document.getElementById("display-meaning");
        const typedEl = document.getElementById("text-typed");
        const untypedEl = document.getElementById("text-untyped");
        const scoreEl = document.getElementById("score-val");

        // --- 2. ANKICONNECT API ENGINE ---
        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Communication Error:", err);
                return null;
            }
        }

        async function loadAnkiDeck() {
            // Step A: Grab Note IDs matching query
            const findResult = await fetchFromAnki("findNotes", { query: `deck:"${DECK_NAME}"` });
            
            if (!findResult || !findResult.result || findResult.result.length === 0) {
                statusEl.textContent = "Error: Could not find deck or connect to Anki desktop application.";
                return;
            }

            // Step B: Grab note data strings using IDs
            const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
            
            // Step C: Map note data into standard javascript array object formats
            wordList = notesResult.result.map(note => {
                const fields = note.fields;
                return {
                    // Stripping any default HTML styling brackets Anki might inject inside strings
                    kanji: fields[FIELD_KANJI]?.value.replace(/<[^>]*>/g, '') || "N/A",
                    romaji: fields[FIELD_ROMAJI]?.value.replace(/<[^>]*>/g, '').toLowerCase().trim() || "na",
                    meaning: fields[FIELD_MEANING]?.value.replace(/<[^>]*>/g, '') || "N/A"
                };
            }).filter(word => word.romaji !== "na"); // Filter cards missing romaji strings

            if (wordList.length > 0) {
                statusEl.style.color = "#28a745";
                statusEl.textContent = `Connected! Synchronized ${wordList.length} cards from "${DECK_NAME}"`;
                shuffleArray(wordList); // Scramble current array order so it is random layout
                loadWord();
            } else {
                statusEl.textContent = "Error: Connected, but found no usable notes with valid Romaji fields.";
            }
        }

        // --- 3. GAME RUNTIME INTERACTION ENGINE ---
        function loadWord() {
            if (wordList.length === 0) return;
            const currentWord = wordList[currentIndex];
            
            wordEl.textContent = currentWord.kanji;
            meaningEl.textContent = currentWord.meaning;
            
            typedTargetPosition = 0;
            typedEl.textContent = "";
            untypedEl.textContent = currentWord.romaji;
        }

        window.addEventListener("keydown", (e) => {
            if (e.key.length > 1 || wordList.length === 0) return; 

            const currentWord = wordList[currentIndex];
            const expectedChar = currentWord.romaji[typedTargetPosition];

            if (e.key.toLowerCase() === expectedChar) {
                typedTargetPosition++;
                typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
                untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

                if (typedTargetPosition === currentWord.romaji.length) {
                    totalScore++;
                    scoreEl.textContent = totalScore;
                    
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }
            }
        });

        // Helper helper function to mix card array index values cleanly
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Boot Init run
        loadAnkiDeck();
    </script>
</body>
</html>
