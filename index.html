<!DOCTYPE html>
<html lang="en" data-theme="dark-slate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Type</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700&family=Yuji+Syuku&family=DotGothic16&family=Zen+Maru+Gothic:wght@700&family=Yomogi&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Chokokutai&family=Cherry+Bomb+One&family=Zen+Tokyo+Zoo&family=Noto+Sans+JP:wght@400;700&family=Hina+Mincho&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ROUNDED FLOATING NAVBAR -->
    <nav class="top-navbar">
        <div class="nav-content">
            <div class="nav-brand">
                <span class="logo-dot"></span> ANKI TYPE
            </div>

            <div class="nav-actions">
                <!-- Test Options Tab Button (Default Open) -->
                <button class="nav-btn active" id="test-options-tab-btn" title="Test Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                    <span>TEST OPTIONS</span>
                </button>

                <!-- Anki Settings Tab Button -->
                <button class="nav-btn" id="anki-tab-btn" title="Anki Deck Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span>ANKI</span>
                </button>

                <!-- Appearance Tab Button -->
                <button class="nav-btn" id="appearance-tab-btn" title="Font & Theme Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                    <span>THEME & FONT</span>
                </button>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: TEST OPTIONS (Active by default) -->
        <div class="nav-drawer" id="test-options-drawer">
            <div class="drawer-inner grid-2">
                <div class="error-toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" id="space-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">NO SPACES</span>
                </div>

                <div class="error-toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" id="error-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">SHOW CORRECTNESS HIGHLIGHTS</span>
                </div>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: ANKI SETTINGS -->
        <div class="nav-drawer hidden" id="anki-drawer">
            <div class="drawer-inner">
                <div class="drawer-header">
                    <span class="drawer-title">ANKI CONNECTION</span>
                    <div class="status-badge" id="status">INIT CONNECTION</div>
                </div>
                <div class="selector-container">
                    <label for="deck-select">SELECT DECK</label>
                    <select id="deck-select">
                        <option value="">Querying local database...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- EXPANDABLE DRAWER: APPEARANCE SETTINGS -->
        <div class="nav-drawer hidden" id="appearance-drawer">
            <div class="drawer-inner grid-2">
                <div class="selector-container">
                    <label for="theme-select">COLOR THEME</label>
                    <select id="theme-select">
                        <option value="dark-slate">Dark Slate (Default)</option>
                        <option value="carbon">Carbon (High Contrast)</option>
                        <option value="cyberpunk">Cyberpunk Neon</option>
                        <option value="serika">Serika Dark</option>
                        <option value="dracula">Dracula</option>
                    </select>
                </div>

                <div class="selector-container">
                    <label for="font-select">JAPANESE FONT</label>
                    <select id="font-select">
                        <optgroup label="Standard Styles">
                            <option value="font-modern">Modern Gothic (Default)</option>
                            <option value="font-noto">Noto Sans (Ultra Clean)</option>
                            <option value="font-serif">Traditional Mincho (Kaisei)</option>
                            <option value="font-hina">Delicate Mincho (Hina)</option>
                        </optgroup>
                        <optgroup label="Handwriting & Pop">
                            <option value="font-brush">Calligraphy Brush (Yuji)</option>
                            <option value="font-yomogi">Thin Handwriting (Yomogi)</option>
                            <option value="font-hachi">80s Gyaru Pop (Hachi Maru)</option>
                            <option value="font-mochiy">Comic Pop Art (Mochiy)</option>
                            <option value="font-rounded">Rounded Pop (Zen Maru)</option>
                        </optgroup>
                        <optgroup label="Experimental & Retro">
                            <option value="font-pixel">Retro 8-Bit (DotGothic)</option>
                            <option value="font-carved">Wood Carved (Chokokutai)</option>
                            <option value="font-bomb">Bubble Graffiti (Cherry Bomb)</option>
                            <option value="font-zoo">Abstract Grill (Zen Tokyo Zoo)</option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <div class="app-layout">
        <!-- MONKEYTYPE SCROLLING CONTAINER FRAME -->
        <div class="words-wrapper" id="words-wrapper">
            <!-- Initialized with 'no-spaces' class by default -->
            <div class="words-container no-spaces" id="words-container">
                <!-- Dynamic Word Nodes Render Here -->
            </div>
        </div>

        <div class="typing-controls-hint">
            <span>[TAB] TOGGLE ROMAJI READINGS</span> • <span>[CLICK WORD] SHOW MEANING</span>
        </div>

        <!-- LIVE TYPING INPUT DISPLAY BOX WITH TOGGLES & RESTORE BTN -->
        <div class="live-input-container" id="live-input-container">
            <div class="live-input-box-wrapper">
                <div class="live-input-box" id="live-input-box">
                    <span class="placeholder-text" id="input-placeholder">Type active word...</span>
                    <span id="live-input-text"></span>
                    <button class="hide-box-btn" id="hide-box-btn" title="Hide Input Box (Monkeytype Mode)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 14 10 14 10 20"></polyline>
                            <polyline points="20 10 14 10 14 4"></polyline>
                            <line x1="14" y1="10" x2="21" y2="3"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="toggles-row">
                <div class="score-panel-inline">
                    <span class="label">CARDS TYPED</span>
                    <span class="value" id="score-val">0</span>
                </div>

                <a href="https://ko-fi.com/mojikazu" target="_blank" rel="noopener noreferrer" class="kofi-btn-icon" title="Support via Ko-fi">
                    <svg class="kofi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                </a>
            </div>
        </div>

        <button class="restore-box-btn hidden" id="restore-box-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            SHOW INPUT BOX
        </button>
    </div>

    <script>
        const FIELD_KANJI = "Expression";    
        const FIELD_ROMAJI = "ExpressionReading";    
        const FIELD_MEANING = "MainDefinition";   

        let wordList = [];
        let currentIndex = 0;
        let typedInput = []; 
        let incorrectCount = 0;
        const MAX_INCORRECT = 10;

        let totalScore = 0;
        let showRomaji = true;
        let showMeaning = false;
        let showErrorColors = true;
        let removeSpaces = true; // Default to true
        let isInputBoxHidden = false;
        let currentFontClass = "font-modern";

        const statusEl = document.getElementById("status");
        const wordsContainer = document.getElementById("words-container");
        const scoreEl = document.getElementById("score-val");
        const deckDropdown = document.getElementById("deck-select");
        const fontDropdown = document.getElementById("font-select");
        const themeDropdown = document.getElementById("theme-select");
        const liveInputText = document.getElementById("live-input-text");
        const inputPlaceholder = document.getElementById("input-placeholder");
        const liveInputBox = document.getElementById("live-input-box");
        const errorToggle = document.getElementById("error-toggle");
        const spaceToggle = document.getElementById("space-toggle");
        const hideBoxBtn = document.getElementById("hide-box-btn");
        const restoreBoxBtn = document.getElementById("restore-box-btn");

        // Navbar drawers & buttons
        const testOptionsTabBtn = document.getElementById("test-options-tab-btn");
        const ankiTabBtn = document.getElementById("anki-tab-btn");
        const appearanceTabBtn = document.getElementById("appearance-tab-btn");
        
        const testOptionsDrawer = document.getElementById("test-options-drawer");
        const ankiDrawer = document.getElementById("anki-drawer");
        const appearanceDrawer = document.getElementById("appearance-drawer");

        function cleanHtmlText(rawHtml) {
            if (!rawHtml) return "";
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            return doc.body.textContent || "";
        }

        async function fetchFromAnki(action, params = {}) {
            try {
                const response = await fetch("http://localhost:8765", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action, version: 6, params })
                });
                return await response.json();
            } catch (err) {
                console.error("AnkiConnect Failure:", err);
                return null;
            }
        }

        async function populateDecks() {
            const response = await fetchFromAnki("deckNames");
            if (!response || !response.result) {
                statusEl.textContent = "OFFLINE - START ANKI";
                statusEl.className = "status-badge status-offline";
                deckDropdown.innerHTML = '<option value="">Network Error</option>';
                return;
            }

            const decks = response.result;
            deckDropdown.innerHTML = ""; 

            decks.forEach(deckName => {
                const option = document.createElement("option");
                option.value = deckName;
                option.textContent = deckName.toUpperCase();
                deckDropdown.appendChild(option);
            });

            deckDropdown.addEventListener("change", (e) => {
                if (e.target.value) loadAnkiDeck(e.target.value);
            });

            if (decks.length > 0) {
                deckDropdown.value = decks[0];
                loadAnkiDeck(decks[0]);
            }
        }

        async function loadAnkiDeck(targetDeckName) {
            statusEl.className = "status-badge status-loading";
            statusEl.textContent = "LOADING QUEUE";
            
            const findResult = await fetchFromAnki("findNotes", { query: `deck:"${targetDeckName}"` });
            if (!findResult || !findResult.result || findResult.result.length === 0) {
                statusEl.textContent = "DECK EMPTY";
                statusEl.className = "status-badge status-offline";
                wordsContainer.innerHTML = `<div class="empty-state">No cards found in deck "${targetDeckName}".</div>`;
                return;
            }

            const notesResult = await fetchFromAnki("notesInfo", { notes: findResult.result });
            
            wordList = notesResult.result.map(note => {
                const fields = note.fields;
                let rawRomaji = fields[FIELD_ROMAJI]?.value || "";
                let cleanedRomajiText = cleanHtmlText(rawRomaji).trim();
                let finalRomaji = wanakana.toRomaji(cleanedRomajiText).toLowerCase().trim();

                return {
                    kanji: cleanHtmlText(fields[FIELD_KANJI]?.value || "N/A"),
                    romaji: finalRomaji,
                    meaning: cleanHtmlText(fields[FIELD_MEANING]?.value || "N/A")
                };
            }).filter(word => word.romaji !== "");

            if (wordList.length > 0) {
                statusEl.className = "status-badge status-online";
                statusEl.textContent = `${wordList.length} TRACKS SYNCED`;
                currentIndex = 0;
                typedInput = [];
                incorrectCount = 0;
                totalScore = 0;
                scoreEl.textContent = totalScore;
                shuffleArray(wordList);
                renderWordBlock();
            } else {
                statusEl.textContent = "PARSE ERROR";
                statusEl.className = "status-badge status-offline";
                wordsContainer.innerHTML = '<div class="empty-state">Unable to parse cards from selected deck.</div>';
            }
        }

        function renderWordBlock() {
            wordsContainer.innerHTML = "";
            wordsContainer.style.transform = `translateY(0px)`;

            wordList.forEach((wordObj, idx) => {
                const wordNode = document.createElement("div");
                wordNode.className = "word-item";
                if (idx === currentIndex) wordNode.classList.add("active");

                const kanjiWrapperNode = document.createElement("div");
                kanjiWrapperNode.className = "kanji-wrapper";

                const kanjiNode = document.createElement("div");
                kanjiNode.className = `kanji-text ${currentFontClass}`;
                kanjiNode.textContent = wordObj.kanji;
                kanjiWrapperNode.appendChild(kanjiNode);

                const kanjiErrorSpan = document.createElement("span");
                kanjiErrorSpan.className = "kanji-side-error";
                kanjiWrapperNode.appendChild(kanjiErrorSpan);

                const romajiNode = document.createElement("div");
                romajiNode.className = `romaji-text ${!showRomaji ? 'hidden' : ''}`;
                
                for (let i = 0; i < wordObj.romaji.length; i++) {
                    const charSpan = document.createElement("span");
                    charSpan.className = "char";
                    charSpan.textContent = wordObj.romaji[i];
                    romajiNode.appendChild(charSpan);
                }

                const overflowSpan = document.createElement("span");
                overflowSpan.className = "romaji-overflow-error";
                romajiNode.appendChild(overflowSpan);

                const meaningNode = document.createElement("div");
                meaningNode.className = `meaning-text ${!showMeaning ? 'hidden' : ''}`;
                meaningNode.textContent = wordObj.meaning;

                wordNode.appendChild(kanjiWrapperNode);
                wordNode.appendChild(romajiNode);
                wordNode.appendChild(meaningNode);

                // Word Click Handler - Disabled if "No Spaces" is enabled
                wordNode.addEventListener("click", () => {
                    if (removeSpaces) return; // Prevent meaning toggle when No Spaces is active
                    showMeaning = !showMeaning;
                    updateVisibility();
                });

                wordsContainer.appendChild(wordNode);
            });

            updateDisplay();
        }

        function updateDisplay() {
            const currentWordObj = wordList[currentIndex];
            const currentWordNode = wordsContainer.children[currentIndex];
            if (!currentWordNode || !currentWordObj) return;

            let correctCount = 0;
            for (let i = 0; i < typedInput.length; i++) {
                if (typedInput[i].isCorrect) correctCount++;
                else break; 
            }

            const romajiNode = currentWordNode.querySelector(".romaji-text");
            const charSpans = romajiNode.querySelectorAll(".char");
            const overflowSpan = romajiNode.querySelector(".romaji-overflow-error");
            const kanjiErrorSpan = currentWordNode.querySelector(".kanji-side-error");

            overflowSpan.textContent = "";
            kanjiErrorSpan.textContent = "";

            const kanjiLength = currentWordObj.kanji.length;
            const shouldHideRomajiForOverlay = isInputBoxHidden && (typedInput.length <= kanjiLength);

            if (shouldHideRomajiForOverlay) {
                romajiNode.classList.add("romaji-overlay-hidden");
            } else {
                romajiNode.classList.remove("romaji-overlay-hidden");
            }

            charSpans.forEach((span, idx) => {
                span.classList.remove("correct", "current", "incorrect", "neutral-typed");
                
                if (idx < correctCount) {
                    if (showErrorColors) {
                        span.classList.add("correct");
                    } else {
                        span.classList.add("neutral-typed");
                    }
                } else if (idx === correctCount && incorrectCount === 0) {
                    span.classList.add("current");
                } else if (idx === correctCount && incorrectCount > 0) {
                    if (showErrorColors) {
                        span.classList.add("incorrect");
                    } else {
                        span.classList.add("neutral-typed");
                    }
                }
            });

            if (incorrectCount > 0) {
                let wrongChars = typedInput.slice(correctCount).map(item => item.char).join("");
                
                if (showErrorColors) {
                    if (showRomaji) {
                        overflowSpan.textContent = wrongChars;
                    } else {
                        kanjiErrorSpan.textContent = wrongChars;
                    }
                }
            }

            // Update Live Input Box Text
            liveInputText.innerHTML = "";
            if (typedInput.length > 0) {
                inputPlaceholder.style.display = "none";
                typedInput.forEach(entry => {
                    const charSpan = document.createElement("span");
                    charSpan.textContent = entry.char;
                    
                    if (!entry.isCorrect && showErrorColors) {
                        charSpan.className = "typed-char-wrong";
                    } else if (entry.isCorrect && showErrorColors) {
                        charSpan.className = "typed-char-correct";
                    } else {
                        charSpan.className = "typed-char-neutral";
                    }
                    liveInputText.appendChild(charSpan);
                });
            } else {
                inputPlaceholder.style.display = "inline";
            }

            // Scroll Calculation Fix (Works seamlessly in both Space and No-Spaces mode)
            const firstWordTop = wordsContainer.children[0].offsetTop;
            const currentWordTop = currentWordNode.offsetTop;
            const lineOffset = currentWordTop - firstWordTop;

            if (lineOffset > 20) {
                wordsContainer.style.transform = `translateY(-${lineOffset}px)`;
            } else {
                wordsContainer.style.transform = `translateY(0px)`;
            }
        }

        function updateVisibility() {
            const allRomaji = document.querySelectorAll(".romaji-text");
            const allMeaning = document.querySelectorAll(".meaning-text");

            allRomaji.forEach(el => showRomaji ? el.classList.remove("hidden") : el.classList.add("hidden"));
            allMeaning.forEach(el => showMeaning ? el.classList.remove("hidden") : el.classList.add("hidden"));

            updateDisplay();
        }

        // Global Keyboard Handler
        window.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                showRomaji = !showRomaji;
                updateVisibility();
                return;
            }

            if (wordList.length === 0) return;
            const currentWord = wordList[currentIndex];

            // CTRL + BACKSPACE / CMD + BACKSPACE: Delete entire word input
            if (e.key === "Backspace" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                typedInput = [];
                incorrectCount = 0;
                updateDisplay();
                return;
            }

            // SINGLE BACKSPACE
            if (e.key === "Backspace") {
                if (typedInput.length > 0) {
                    const removed = typedInput.pop();
                    if (!removed.isCorrect) {
                        incorrectCount = Math.max(0, incorrectCount - 1);
                    }
                    updateDisplay();
                }
                return;
            }

            if (e.key.length > 1 || e.ctrlKey || e.metaKey || e.altKey) return; 

            const keyTyped = e.key.toLowerCase();

            let correctCount = 0;
            for (let i = 0; i < typedInput.length; i++) {
                if (typedInput[i].isCorrect) correctCount++;
                else break;
            }

            const expectedChar = currentWord.romaji[correctCount];

            if (incorrectCount === 0 && keyTyped === expectedChar) {
                typedInput.push({ char: keyTyped, isCorrect: true });
            } else {
                if (incorrectCount >= MAX_INCORRECT) {
                    return; 
                }
                typedInput.push({ char: keyTyped, isCorrect: false });
                incorrectCount++;
            }

            let currentCorrectCount = typedInput.filter(t => t.isCorrect).length;
            if (incorrectCount === 0 && currentCorrectCount === currentWord.romaji.length) {
                const finishedWordNode = wordsContainer.children[currentIndex];
                finishedWordNode.classList.remove("active");
                finishedWordNode.classList.add("completed");

                totalScore++;
                scoreEl.textContent = totalScore;

                currentIndex++;
                typedInput = [];
                incorrectCount = 0;

                if (currentIndex < wordList.length) {
                    wordsContainer.children[currentIndex].classList.add("active");
                } else {
                    currentIndex = 0;
                    renderWordBlock();
                }
            }

            updateDisplay();
        });

        // Navbar Drawer Toggle Event Listeners
        testOptionsTabBtn.addEventListener("click", () => {
            ankiDrawer.classList.add("hidden");
            ankiTabBtn.classList.remove("active");
            appearanceDrawer.classList.add("hidden");
            appearanceTabBtn.classList.remove("active");

            testOptionsDrawer.classList.toggle("hidden");
            testOptionsTabBtn.classList.toggle("active");
        });

        ankiTabBtn.addEventListener("click", () => {
            testOptionsDrawer.classList.add("hidden");
            testOptionsTabBtn.classList.remove("active");
            appearanceDrawer.classList.add("hidden");
            appearanceTabBtn.classList.remove("active");
            
            ankiDrawer.classList.toggle("hidden");
            ankiTabBtn.classList.toggle("active");
        });

        appearanceTabBtn.addEventListener("click", () => {
            testOptionsDrawer.classList.add("hidden");
            testOptionsTabBtn.classList.remove("active");
            ankiDrawer.classList.add("hidden");
            ankiTabBtn.classList.remove("active");
            
            appearanceDrawer.classList.toggle("hidden");
            appearanceTabBtn.classList.toggle("active");
        });

        // Error Toggle Switch
        errorToggle.addEventListener("change", (e) => {
            showErrorColors = e.target.checked;
            updateDisplay();
        });

        // Space Removal Toggle
        spaceToggle.addEventListener("change", (e) => {
            removeSpaces = e.target.checked;
            if (removeSpaces) {
                wordsContainer.classList.add("no-spaces");
                showMeaning = false; // Hide meanings if opening no spaces
            } else {
                wordsContainer.classList.remove("no-spaces");
            }
            updateVisibility();
        });

        // Theme Switcher
        themeDropdown.addEventListener("change", (e) => {
            document.documentElement.setAttribute("data-theme", e.target.value);
        });

        // Hide Live Input Box Logic
        hideBoxBtn.addEventListener("click", () => {
            isInputBoxHidden = true;
            liveInputBox.classList.add("hidden");
            restoreBoxBtn.classList.remove("hidden");
            updateDisplay();
        });

        // Restore Live Input Box Logic
        restoreBoxBtn.addEventListener("click", () => {
            isInputBoxHidden = false;
            liveInputBox.classList.remove("hidden");
            restoreBoxBtn.classList.add("hidden");
            updateDisplay();
        });

        fontDropdown.addEventListener("change", (e) => {
            currentFontClass = e.target.value;
            const kanjiElements = document.querySelectorAll(".kanji-text");
            kanjiElements.forEach(el => {
                el.className = `kanji-text ${currentFontClass}`;
            });
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        populateDecks();
    </script>
</body>
</html>
