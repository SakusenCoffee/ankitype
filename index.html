<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Typing Practice</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0 0 10px 0;
        }
        .meaning {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .romaji-container {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .typed {
            color: #28a745;
            font-weight: bold;
        }
        .untyped {
            color: #ccc;
        }
        .score {
            margin-top: 30px;
            font-size: 1rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="kanji" id="display-word">日本語</div>
        <div class="meaning" id="display-meaning">Japanese Language</div>
        
        <div class="romaji-container">
            <span class="typed" id="text-typed"></span><span class="untyped" id="text-untyped">nihongo</span>
        </div>

        <div class="score">Score: <span id="score-val">0</span></div>
    </div>

    <script>
        // 1. Core Vocabulary Data Array
        const wordList = [
            { kanji: "日本語", romaji: "nihongo", meaning: "Japanese language" },
            { kanji: "食べる", romaji: "taberu", meaning: "To eat" },
            { kanji: "友達", romaji: "tomodachi", meaning: "Friend" },
            { kanji: "猫", romaji: "neko", meaning: "Cat" },
            { kanji: "美味しい", romaji: "oishii", meaning: "Delicious" },
            { kanji: "桜", romaji: "sakura", meaning: "Cherry blossom" },
            { kanji: "先生", romaji: "sensei", meaning: "Teacher" }
        ];

        let currentIndex = 0;
        let typedTargetPosition = 0;
        let totalScore = 0;

        // Elements
        const wordEl = document.getElementById("display-word");
        const meaningEl = document.getElementById("display-meaning");
        const typedEl = document.getElementById("text-typed");
        const untypedEl = document.getElementById("text-untyped");
        const scoreEl = document.getElementById("score-val");

        // 2. Load Word onto Interface
        function loadWord() {
            const currentWord = wordList[currentIndex];
            wordEl.textContent = currentWord.kanji;
            meaningEl.textContent = currentWord.meaning;
            
            typedTargetPosition = 0;
            typedEl.textContent = "";
            untypedEl.textContent = currentWord.romaji;
        }

        // 3. Keystroke Event Listener Logic
        window.addEventListener("keydown", (e) => {
            // Ignore system keys (Shift, CapsLock, Alt, etc)
            if (e.key.length > 1) return; 

            const currentWord = wordList[currentIndex];
            const expectedChar = currentWord.romaji[typedTargetPosition];

            if (e.key.toLowerCase() === expectedChar) {
                // Correct match -> Advance cursor position
                typedTargetPosition++;
                typedEl.textContent = currentWord.romaji.substring(0, typedTargetPosition);
                untypedEl.textContent = currentWord.romaji.substring(typedTargetPosition);

                // Word Completed!
                if (typedTargetPosition === currentWord.romaji.length) {
                    totalScore++;
                    scoreEl.textContent = totalScore;
                    
                    // Go to next word cyclically
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }
            }
        });

        // Initialize First Run
        loadWord();
    </script>
</body>
</html>
